<div class="card p-4 m-3">
    ID: {{multa.id}} <br>
    Monto: {{multa.monto}} <br>
    Estado: 
    @if (multa.estado) {
        Pagado
    } @else {
        Pendiente
    } <br>
    @if (multa.fechaPago) {
        Fecha de Pago: {{multa.fechaPago}}
    }
    Deudor: {{multa.deudor}}
    <button type="button" data-bs-toggle="modal" data-bs-target="#deleteModal"
    title="Confirmar Recepcion del pago de {{ multa.deudor}}" 
    class="w-25 mx-auto m-3 btn btn-success"
    (click)="elegirMulta()">
        Recibir Pago
    </button>
</div>
