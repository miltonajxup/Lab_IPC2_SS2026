<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu></app-menu>
    <main class="content flex-grow-1 p-4 border-start">
        
        @if (isEditMode) {
            <h3 class="text-center titulo p-3">Modifica un Año Lectivo</h3>
        } @else {
            <h3 class="text-center titulo p-3">Crea un Nuevo Año Lectivo</h3>
        }

        <button routerLink="/control-ciclo-escolar">Regresar</button>

        <div class="text-center t20 m-3">
            @if (operacionCompletada()) {
                <div class="text-success ">Operación Completada</div>
            }
            @if (mensaje()) {
                <p class="text-danger">{{mensaje()}}</p>
            }
        </div>

        <div class="row justify-content-center">
            <form [formGroup]="anioForm" class=" card shadow w-25 h-100" (submit)="submit()">
                @if (isEditMode) {
                    <label class="form-label p-3">
                        <input type="" [value]="anioParaActualizar.anio" readonly>
                    </label>
                } @else {
                    <label class="form-label p-3">
                        Año que Estará Vigente
                        <input class="form-control" type="number" formControlName="anio" >
                    </label>
                }
                <label class="form-label p-3">
                    Fecha de Inicio
                    <input class="form-control" type="date" formControlName="fechaInicio" >
                </label>
                <label class="form-label p-3">
                    Fecha de Finalizacion
                    <input class="form-control" type="date" formControlName="fechaFin">
                </label>
                <button class="btn btn-primary mb-5 w-25 mx-auto" [disabled]="anioForm.invalid" >Guardar</button>
            </form>
        </div>

    </main>
</div>
