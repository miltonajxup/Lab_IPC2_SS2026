<app-header [rol]="rol" ></app-header>
<div class="d-flex border-bottom">
    <app-menu></app-menu>
    <main class="content flex-grow-1 p-4 border-start">

        <h3 class="text-center titulo p-3">Control de los Grados</h3>

        @if (mensajeError()) {
            <div class="text-center t25 text-danger m-3">{{mensajeError()}}</div>
        }

        <div class="d-flex justify-content-center align-items-center mb-5 flex-column gap-3 t25">
            @for (grado of grados(); track grado.id) {
                <div class="card">
                    <div class="">
                        {{grado.nombre}} {{grado.nombreNivel}} 
                        @if (grado.estado) {
                        <button 
                        class="btn btn-primary activo" 
                        (click)="modificarEstado(grado.id)">
                            Desactivar
                        </button>
                    } @else {
                        <button 
                        class="btn btn-primary desactivado" 
                        (click)="modificarEstado(grado.id)">
                            Activar
                        </button>
                    }
                </div>
            </div>
            }
        </div>
        
    </main>
</div>
