<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu></app-menu>
    <main class="content flex-grow-1 p-4 border-start">

        <h3 class="text-center titulo p-3">Modificar Curso</h3>

        <button class="btn btn-primary" routerLink="/curso">Regresar</button>

        @if (cursoParaActualizar()) {
            <app-form-curso [cursoParaEditar]="cursoParaActualizar()!" [isEditMode]="true" ></app-form-curso>
        } @else {
            <div class="alert alert-danger" role="alert">
                No se encontro la carrera con codigo {{idCurso}}
            </div>
        }
        
    </main>
</div>
