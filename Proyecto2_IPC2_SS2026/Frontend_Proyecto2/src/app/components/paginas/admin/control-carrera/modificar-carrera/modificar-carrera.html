<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu></app-menu>
    <main class="content flex-grow-1 p-4 border-start">

        <h3 class="text-center titulo p-3">Modificar Carrera</h3>

        <button class="btn btn-primary" routerLink="/carrera">Regresar</button>

        @if (carreraParaActualizar()) {
            <app-form-carrera [carreraParaEditar]="carreraParaActualizar()!" [isEditMode]="true" ></app-form-carrera>
        } @else {
            <div class="alert alert-danger" role="alert">
                No se encontro la carrera con codigo {{codigoCarrera}}
            </div>
        }
        
    </main>
</div>
