<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu></app-menu>
    <main class="content flex-grow-1 p-4 border-start">

        <h3 class="text-center titulo p-3">Carreras del Colegio</h3>

        <div class="d-flex justify-content-center mb-5">
            <button class="w-25 btn btn-primary t20" routerLink="/carrera/crear" >Crear Nueva Carrera</button>
        </div>

        <div class="column text-center">

            @if (mensajeError()) {
                <div class="text-danger">{{mensajeError()}}</div>
            }

            <div class="d-flex gap-5 justify-content-center mb-4 t20">
                <button (click)="(avanzarPagina(-1))" > < </button>
                Pagina: {{pagina()}}
                <button (click)="avanzarPagina(1)" > > </button>
            </div>
        </div>

        @for (carrera of carreras(); track carrera.codigo) {
            <div class="card w-50 mx-auto t25 mb-5"> 
                Codigo: {{carrera.codigo}} <br>
                Nombre: {{carrera.nombre}} <br>
                Duracion: {{carrera.grados?.length}} años
                <div class="w-50 mx-auto m-3 d-flex gap-5 justify-content-center">
                    <button routerLink="/carrera/modificar/{{carrera.codigo}}" class="btn btn-primary ">Modificar</button>
                </div>
            </div>
        }
        
    </main>
</div>
