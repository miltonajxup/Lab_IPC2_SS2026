<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu></app-menu>
    <main class="content flex-grow-1 p-4 border-start">

        <h3 class="text-center titulo p-3">Definir los Curriculos de Los Grados</h3>

        <button class="btn btn-primary" routerLink="/curriculo">Regresar</button>

        @if (mensajeError()) {
            <div class="text-danger text-center t20">{{mensajeError()}}</div>
        }
        @if (operacionCompleatada()) {
            <div class="text-success text-center t20">Se ha guardado el Curriculo</div>
        }

        <form [formGroup]="curriculoForm" (submit)="submit()" >
            <div class="t25 d-flex flex-row justify-content-center gap-5">
                
                <app-lista-grados-normales [idGrado]="curriculoForm.value.gradoId" (gradoSelecionado)="setGrado($event)"></app-lista-grados-normales>

                <app-lista-cursos [idCurso]="curriculoForm.value.cursoId" (cursoSeleccionado)="setCurso($event)"></app-lista-cursos>

            </div>
            <div class="mx-auto w-25 d-flex justify-content-center">
                <button class="btn btn-primary" [disabled]="curriculoForm.invalid" >
                    Guardar
                </button>
            </div>
        </form>
        
    </main>
</div>
