<div class="container-fluid min-vh-100">
    
  
    <div class="row p-5 text-center titulo">
        <div class="">
        <h1>Recuperar Contraseña</h1>
        </div>
    </div>

    <button class="btn btn-primary ml-5" routerLink="">Regresar</button>
    <p class="t25 text-center">Para recuperar la contraseña  <br> ingresa alguna contraseña anterior </p>

    @if (mensajeError()) {
        <div class="text-danger text-center mb-5 t20"> {{mensajeError()}} </div>
    }

    <div class="card shadow p-5 w-25 h-25 mx-auto">
        <h2 class="text-center mb-4"></h2>
        
        <form [formGroup]="contraseniaForm" (submit)="submit()" >
        <div class="mb-3">
            <label class="form-label">Nombre de Usuario</label>
            <input class="form-control" formControlName="nombre" >
        </div>

        <div class="mb-3">
            <label class="form-label">Confirma tu Identidad con el DPI/CUI</label>
            <input class="form-control" formControlName="dpi" >
        </div>
            
        <div class="mb-5">
            <label class="form-label">Alguna Contraseña utilizada</label>
            <input type="password" class="form-control" formControlName="contrasenia" >
        </div>
        
        <button class="btn btn-primary w-100" [disabled]="contraseniaForm.invalid">
            Ingresar
        </button>
        </form>
    </div>

</div>
