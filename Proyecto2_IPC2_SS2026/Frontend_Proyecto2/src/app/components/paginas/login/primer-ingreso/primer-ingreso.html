<div class="container-fluid min-vh-100">
  
  <div class="row p-5 text-center titulo">
    <div class="">
      <h1>Ingreso del Sistema por Primera vez</h1>
      <p>Establece una Contraseña Para acceder al sistema</p>
    </div>
  </div>
  
  <button class="btn btn-primary ml-5" routerLink="">Regresar</button>

  @if (mensajeError()) {
    <div class="text-danger text-center mb-5 t20"> {{mensajeError()}} </div>
  }
  
  @if (operacionCompletada()) {
    <div class="text-center text-success t20 mb-4">
        La contraseña se ha establecido de forma exitosa <br>
        Ahora se puede ingresar en login
    </div>
  }

  
  <div class="card shadow p-5 w-25 h-25 mx-auto">
    <h2 class="text-center mb-4">Define una Contraseña</h2>
    
    <form [formGroup]="formLogin" (submit)="submit()" >
      <div class="mb-3">
        <label class="form-label">Nombre de Usuario</label>
        <input class="form-control" formControlName="nombre" >
      </div>

      <div class="mb-3">
        <label class="form-label">Confirma tu Identidad con el DPI/CUI</label>
        <input class="form-control" formControlName="dpi" >
      </div>
        
      <div class="mb-5">
        <label class="form-label">Contraseña (Mínimo 4 caracteres)</label>
        <input type="password" class="form-control" formControlName="contrasenia" >
      </div>

      <div class="mb-5">
        <label class="form-label">Confirma la Contraseña</label>
        <input type="password" class="form-control" formControlName="confirmacionContrasenia" >
      </div>
      
      <button class="btn btn-primary w-100" [disabled]="formLogin.invalid">
        Ingresar
      </button>
    </form>
  </div>

</div>
