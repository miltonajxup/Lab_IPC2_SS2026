<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu-maestro></app-menu-maestro>
    <main class="content flex-grow-1 p-4 border-start">

        <h3 class="text-center titulo p-3">Cursos Asignados</h3>

        @if (mensajeError()) {
            <div class="text-danger text-center t20">{{mensajeError()}}</div>
        }

        <div class="w-50 mx-auto d-flex flex-column gap-3">
            @for (curso of cursos(); track curso.idCursoMaestro) {
                <button 
                class="btn btn-primary t25"
                routerLink="/maestro/opciones-curso/{{curso.idCursoMaestro}}">
                    {{curso.nombreCurso}} {{curso.nombreGrado}} {{curso.nombreNivel}} {{curso.anio}}
                </button>
            }
        </div>
        
    </main>
</div>
