<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu-maestro></app-menu-maestro>
    <main class="content flex-grow-1 p-4 border-start">

        @if (mensajeError()) {
            <div class="text-danger text-center t20">{{mensajeError()}}</div>
        } @else {
            <h3 class="text-center titulo p-3">Fechas De Asistencia</h3>

            <button class="btn btn-primary" routerLink="/maestro/opciones-curso/{{idMaes}}">Regresar</button>

            <div class="d-flex justify-content-center align-items-center flex-column t25 gap-5">
                <form [formGroup]="fechaAsistenciaForm" (submit)="submit()" 
                class="d-flex flex-column gap-4 align-items-center">
                    Agregar Nueva Fecha de Asistencia
                    <input type="date" formControlName="fecha" class="w-50" >
                    <button class="btn btn-primary w-50" [disabled]="fechaAsistenciaForm.invalid">
                        Agregar Fecha
                    </button>
                </form>
                @for (fecha of diasDeAsistencia(); track $index) {
                    <button 
                    class="d-flex justify-content-center flex-column"
                    routerLink="/maestro/tomar-asistencia/{{idMaes}}/{{idGrupo}}/{{idCurso}}/{{fecha}}">
                        {{fecha}}
                    </button>
                } @empty {
                    <div class="d-flex justify-content-center flex-column">
                        No Hay Fechas de asistencias
                    </div>
                }
            </div>
        }
        
    </main>
</div>
