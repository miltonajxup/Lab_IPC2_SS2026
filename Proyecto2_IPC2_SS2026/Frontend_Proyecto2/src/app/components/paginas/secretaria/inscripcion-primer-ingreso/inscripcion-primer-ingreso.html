<app-header [rol]="rol"></app-header>
<div class="d-flex border-bottom">
    <app-menu-secretaria></app-menu-secretaria>
    <main class="content flex-grow-1 p-4 border-start">

        <h3 class="text-center titulo p-3">Inscripcion de Primer Ingreso</h3>

        @if (mensajeError()) {
            <div class="text-danger text-center t20">{{mensajeError()}}</div>
        }
        @if (operacionCompletada()) {
            <div class="text-success text-center t20">Se ha Inscrito al Estudiante</div>
        }

        <form [formGroup]="estudianteForm"  (submit)="submit()">
            <div class="d-flex flex-row  ">
                <div class="card shadow p-5  mx-auto">
                    <h2 class="text-center mb-4">Registro de Estudiante</h2>

                    <label class="form-label">
                        DPI / CUI Del estudiante
                        <input class="form-control" formControlName="dpi" >
                    </label>
                    <label class="form-label">
                        Nombre
                        <input class="form-control" formControlName="nombre" >
                    </label>
                    <label class="form-label">
                        Numero Telefonico del Encargado: 
                        <input class="form-control" formControlName="numeroEncargado">
                    </label>
                    <label class="form-label mt-3">
                        Numero Telefonico del estudiante <br>
                        Numero Telefonico Secundario
                        <input class="form-control" formControlName="numeroEstudiante">
                    </label>
                    <div class="mx-auto w-25 d-flex justify-content-center">
                        <button class="btn btn-primary" [disabled]="estudianteForm.invalid" >
                            Guardar
                        </button>
                    </div>
                </div>
                <div class=" d-flex gap-3 flex-column mx-auto">
                    <app-lista-grupos [idGrupo]="estudianteForm.value.grupoId" (grupoElegido)="setGrupo($event)"></app-lista-grupos>
                </div>
            </div>
        </form>

        
        
    </main>
</div>
